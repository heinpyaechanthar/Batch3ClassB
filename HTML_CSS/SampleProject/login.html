<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <h2>Login Form 👌</h2>
        <form action="homepage.html" method="get">
            <label for="text">Username</label>
            <input type="username" id="username" placeholder="Enter your username" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Eneter your password" required>

            <button type="submit" class="btn" >🔓 Login</button>
        </form>
        <p class="auth-link">Don't have an account? <a href="register.html">Register here</a>
        </p>
       
    </div>
</body>
</html>
