<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="reg-body">
    <div class="reg-container">
        <h2>Registration</h2>
        <form action="homepage.html" method="get">
            <label for="text">Username</label>
            <input type="username" id="username" placeholder="Enter your Username" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Eneter your password" required>

            <label for="password">Conform Password</label>
            <input type="password" id="password" placeholder="Eneter your conform password" required>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="phone">Phone Number</label>
            <input type="phone" id="phone" placeholder="Enter your Phone Number" required>

            <button type="submit" class="btn">🔓 Register</button>
            </form>
       <p class="reg-link">Already have an account? <a href="login.html">Login</a>
       </p>
    
    </div>
</body>
</html>
