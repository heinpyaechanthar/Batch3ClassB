<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paradise Vacation - Register</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-layout">
      <div class="auth-image">
        <img src="images/hero-beach.png" alt="Tropical beach welcome">
      </div>
      <div class="auth-box">
        <img class="auth-logo" src="images/logo.png" alt="Paradise Vacation logo">
        <h1>Create account</h1>
        <p>Join us and start planning your next peaceful escape.</p>
        <form action="home.html">
          <label class="input-label" for="name">Username</label>
          <input class="input-box" id="name" type="text" placeholder="Enter your name" required>

          <label class="input-label" for="email">Email</label>
          <input class="input-box" id="email" type="email" placeholder="Enter your email" required>

          <label class="input-label" for="new-password">Password</label>
          <input class="input-box" id="new-password" type="password" placeholder="Create a password" required>

          <button class="button" type="submit">Create Account</button>
        </form>
        <p class="auth-link">Already have an account? <a href="login.html">Log in</a></p>
      </div>
    </section>
  </main>
</body>
</html>
