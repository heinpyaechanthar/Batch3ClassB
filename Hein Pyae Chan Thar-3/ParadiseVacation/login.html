<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paradise Vacation - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-layout">
      <div class="auth-image">
        <img src="images/login-beach.png" alt="Calm beach shore">
      </div>
      <div class="auth-box">
        <img class="auth-logo" src="images/logo.png" alt="Paradise Vacation logo">
        <h1>Welcome back</h1>
        <p>Sign in to access your beach vacation plan.</p>
        <form action="home.html">
          <label class="input-label" for="username">Username</label>
          <input class="input-box" id="username" type="text" placeholder="Enter your username" required>

          <label class="input-label" for="password">Password</label>
          <input class="input-box" id="password" type="password" placeholder="Enter your password" required>
          
          <button class="button" type="submit">Log In</button>
        </form>
        <p class="auth-link">Don't have an account? <a href="register.html">Create Account</a></p>
      </div>
    </section>
  </main>
</body>
</html>
